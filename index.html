<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Particle Gestures</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #030308;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #webcam {
      position: absolute;
      bottom: 15px;
      right: 15px;
      width: 130px;
      height: 98px;
      border-radius: 8px;
      border: 2px solid #00f0ff;
      transform: scaleX(-1);
      z-index: 2;
      object-fit: cover;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ffffff;
      z-index: 2;
      pointer-events: none;
    }
    .status-card {
      background: rgba(10, 10, 20, 0.85);
      padding: 12px 18px;
      border-radius: 10px;
      border-left: 4px solid #00f0ff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
    }
    .status-card h3 {
      margin: 0 0 6px 0;
      font-size: 15px;
      color: #00f0ff;
      letter-spacing: 1px;
    }
    .gesture-hint {
      font-size: 12px;
      line-height: 1.6;
      color: #e0e0e0;
    }
  </style>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="ui-overlay">
    <div class="status-card">
      <h3>PARTICLE CONTROLLER</h3>
      <p id="gesture-status" style="font-weight: bold; color: #ff007f; margin: 0 0 6px 0;">Status: Starting Camera...</p>
      <div class="gesture-hint">
        🖐️ <b>Open Hand</b> ➔ Text "GAURAV & ARYAN"<br>
        ☝️ <b>Index Finger UP</b> ➔ Royal Crown 👑<br>
        ✌️ <b>Peace Sign</b> ➔ Butterfly 🦋<br>
        👍 <b>Thumbs Up</b> ➔ Heart Shape ❤️<br>
        ✊ <b>Fist / No Hand</b> ➔ Galaxy Cloud
      </div>
    </div>
  </div>

  <video id="webcam" autoplay playsinline></video>
  <div id="canvas-container"></div>

  <script>
    const PARTICLE_COUNT = 2400;
    let scene, camera, renderer, particleSystem;
    
    let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    let spacePositions = new Float32Array(PARTICLE_COUNT * 3);
    let heartPositions = new Float32Array(PARTICLE_COUNT * 3);
    let namePositions = new Float32Array(PARTICLE_COUNT * 3);
    let secretPositions = new Float32Array(PARTICLE_COUNT * 3);
    let crownPositions = new Float32Array(PARTICLE_COUNT * 3);
    let butterflyPositions = new Float32Array(PARTICLE_COUNT * 3);

    let activeTarget = 'space'; 
    let desiredColor = new THREE.Color(0x00f0ff);

    // Glowing particle texture
    function createParticleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 32;
      canvas.height = 32;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.4, 'rgba(255,255,255,0.8)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(16, 16, 16, 0, Math.PI * 2);
      ctx.fill();
      return new THREE.CanvasTexture(canvas);
    }

    // Mathematical shape generators (strictly bounded)
    function buildPositions() {
      
      // 1. GALAXY CLOUD
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = Math.cbrt(Math.random()) * 15;

        spacePositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        spacePositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        spacePositions[i * 3 + 2] = r * Math.cos(phi);
        
        currentPositions[i * 3] = spacePositions[i * 3];
        currentPositions[i * 3 + 1] = spacePositions[i * 3 + 1];
        currentPositions[i * 3 + 2] = spacePositions[i * 3 + 2];
      }

      // 2. PERFECT HEART SHAPE
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const t = (i / PARTICLE_COUNT) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        
        heartPositions[i * 3] = x * 0.6;
        heartPositions[i * 3 + 1] = y * 0.6;
        heartPositions[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
      }

      // 3. TEXT "GAURAV & ARYAN" (Scaled down to keep inside screen)
      const canvas = document.createElement('canvas');
      canvas.width = 1000;
      canvas.height = 300;
      const ctx = canvas.getContext('2d');
      
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 60px Arial, Helvetica, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("GAURAV & ARYAN", 500, 150);

      let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let points = [];

      for (let y = 0; y < canvas.height; y += 4) {
        for (let x = 0; x < canvas.width; x += 4) {
          const alpha = imgData.data[(y * canvas.width + x) * 4];
          if (alpha > 128) {
            points.push({
              x: (x - 500) * 0.035,
              y: (150 - y) * 0.035
            });
          }
        }
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const pt = points[i % points.length];
        namePositions[i * 3] = pt.x;
        namePositions[i * 3 + 1] = pt.y;
        namePositions[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
      }

      // 3B. SECRET TEXT "NITI TUMHARI BHABHI HAI"
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 45px Arial, Helvetica, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("NITI TUMHARI BHABHI HAI", 500, 150);

      imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      points = [];

      for (let y = 0; y < canvas.height; y += 4) {
        for (let x = 0; x < canvas.width; x += 4) {
          const alpha = imgData.data[(y * canvas.width + x) * 4];
          if (alpha > 128) {
            points.push({
              x: (x - 500) * 0.035,
              y: (150 - y) * 0.035
            });
          }
        }
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const pt = points[i % points.length];
        secretPositions[i * 3] = pt.x;
        secretPositions[i * 3 + 1] = pt.y;
        secretPositions[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
      }

      // 4. ROYAL CROWN SHAPE 👑
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const progress = (i / PARTICLE_COUNT) * Math.PI;
        const x = (i / PARTICLE_COUNT - 0.5) * 18;
        let y = 0;

        // Peak profile equation for 5 crown points
        y = Math.sin(progress * 5) * 3 + Math.sin(progress * 1) * 2 - 2;
        
        // Add base rim
        if (i % 5 === 0) {
          y = -4;
        }

        crownPositions[i * 3] = x;
        crownPositions[i * 3 + 1] = y;
        crownPositions[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
      }

      // 5. BUTTERFLY SHAPE 🦋
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const t = (i / PARTICLE_COUNT) * Math.PI * 12;
        const r = Math.exp(Math.cos(t)) - 2 * Math.cos(4 * t) + Math.pow(Math.sin(t / 12), 5);
        
        const x = r * Math.sin(t) * 2.8;
        const y = r * Math.cos(t) * 2.8;

        butterflyPositions[i * 3] = x;
        butterflyPositions[i * 3 + 1] = y;
        butterflyPositions[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
      }
    }

    function initThreeJS() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      // Camera distance set to 36 so everything stays inside bounds comfortably
      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 36;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      buildPositions();

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(currentPositions, 3));

      const material = new THREE.PointsMaterial({
        size: 0.45,
        map: createParticleTexture(),
        color: desiredColor,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      particleSystem = new THREE.Points(geometry, material);
      scene.add(particleSystem);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      const positions = particleSystem.geometry.attributes.position.array;
      let targetArray = spacePositions;

      if (activeTarget === 'heart') {
        targetArray = heartPositions;
        desiredColor.setHex(0xff0066); // Hot Pink
      } else if (activeTarget === 'name') {
        targetArray = namePositions;
        desiredColor.setHex(0x00ffff); // Neon Cyan
      } else if (activeTarget === 'secret') {
        targetArray = secretPositions;
        desiredColor.setHex(0xff007f); // Neon Pink
      } else if (activeTarget === 'crown') {
        targetArray = crownPositions;
        desiredColor.setHex(0xffd700); // Royal Gold
      } else if (activeTarget === 'butterfly') {
        targetArray = butterflyPositions;
        desiredColor.setHex(0xe000ff); // Magenta/Violet
      } else {
        desiredColor.setHex(0xffaa00); // Amber Yellow Cloud
      }

      // Smooth Morph Interpolation
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        positions[i] += (targetArray[i] - positions[i]) * 0.09;
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;

      // Color Transition
      particleSystem.material.color.lerp(desiredColor, 0.08);

      // Rotate galaxy sphere gently
      if (activeTarget === 'space') {
        particleSystem.rotation.y += 0.003;
      } else {
        particleSystem.rotation.y += (0 - particleSystem.rotation.y) * 0.1;
      }

      renderer.render(scene, camera);
    }

    function initGestureTracking() {
      const videoElement = document.getElementById('webcam');
      const statusText = document.getElementById('gesture-status');

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 0,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults((results) => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
          // SECRET GESTURE: BOTH HANDS SHOWN
          activeTarget = 'secret';
          statusText.innerHTML = "Gesture: <b>🙌 Secret Reveal ('NITI TUMHARI BHABHI HAI')</b>";
          statusText.style.color = "#ff007f";
        }
        else if (results.multiHandLandmarks && results.multiHandLandmarks.length === 1) {
          const lm = results.multiHandLandmarks[0];

          // Finger states
          const indexUp = lm[8].y < lm[6].y;
          const middleUp = lm[12].y < lm[10].y;
          const ringUp = lm[16].y < lm[14].y;
          const pinkyUp = lm[20].y < lm[18].y;
          const thumbUp = lm[4].y < lm[3].y && lm[4].y < lm[8].y;

          // Gesture Logic
          if (indexUp && middleUp && ringUp && pinkyUp) {
            // 🖐️ OPEN HAND -> GAURAV & ARYAN TEXT
            activeTarget = 'name';
            statusText.innerHTML = "Gesture: <b>🖐️ Open Hand ('GAURAV & ARYAN')</b>";
            statusText.style.color = "#00ffff";
          } 
          else if (indexUp && !middleUp && !ringUp && !pinkyUp && !thumbUp) {
            // ☝️ INDEX FINGER UP -> ROYAL CROWN
            activeTarget = 'crown';
            statusText.innerHTML = "Gesture: <b>☝️ Index UP (Crown 👑)</b>";
            statusText.style.color = "#ffd700";
          } 
          else if (indexUp && middleUp && !ringUp && !pinkyUp) {
            // ✌️ PEACE SIGN -> BUTTERFLY
            activeTarget = 'butterfly';
            statusText.innerHTML = "Gesture: <b>✌️ Peace Sign (Butterfly 🦋)</b>";
            statusText.style.color = "#e000ff";
          } 
          else if (thumbUp && !indexUp && !middleUp) {
            // 👍 THUMBS UP -> HEART SHAPE
            activeTarget = 'heart';
            statusText.innerHTML = "Gesture: <b>👍 Thumbs Up (Heart ❤️)</b>";
            statusText.style.color = "#ff0066";
          } 
          else {
            // ✊ FIST / NEUTRAL -> GALAXY CLOUD
            activeTarget = 'space';
            statusText.innerHTML = "Gesture: <b>Hand Detected (Show Sign)</b>";
            statusText.style.color = "#ffffff";
          }
        } else {
          activeTarget = 'space';
          statusText.innerHTML = "Status: <b>Searching for Hand...</b>";
          statusText.style.color = "#ffaa00";
        }
      });

      const cameraUtil = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 320,
        height: 240
      });

      cameraUtil.start();
    }

    window.onload = () => {
      initThreeJS();
      animate();
      initGestureTracking();
    };
  </script>
</body>
</html>
