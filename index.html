<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Gesture Controller</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #030308;
      font-family: Arial, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #webcam {
      position: absolute;
      bottom: 15px;
      right: 15px;
      width: 140px;
      height: 105px;
      border-radius: 8px;
      border: 2px solid #00f0ff;
      transform: scaleX(-1);
      z-index: 2;
      object-fit: cover;
    }
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ffffff;
      z-index: 2;
      pointer-events: none;
    }
    .status-card {
      background: rgba(10, 10, 20, 0.85);
      padding: 12px 18px;
      border-radius: 10px;
      border-left: 4px solid #00f0ff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .status-card h3 {
      margin: 0 0 6px 0;
      font-size: 16px;
      color: #00f0ff;
    }
    .gesture-hint {
      font-size: 13px;
      line-height: 1.5;
      color: #e0e0e0;
    }
  </style>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="ui-overlay">
    <div class="status-card">
      <h3>PARTICLE CONTROLLER</h3>
      <p id="gesture-status" style="font-weight: bold; color: #ff007f; margin: 0 0 6px 0;">Status: Starting Camera...</p>
      <div class="gesture-hint">
        🖐️ <b>Open Hand</b> ➔ Text "BHUMI & AYUSH"<br>
        👍 <b>Thumbs Up</b> ➔ Heart Shape<br>
        ✌️ <b>Peace Sign</b> ➔ Square Shape<br>
        ✊ <b>Fist / No Hand</b> ➔ Galaxy Cloud
      </div>
    </div>
  </div>

  <video id="webcam" autoplay playsinline></video>
  <div id="canvas-container"></div>

  <script>
    // Optimized particle count for smooth 60fps performance on tablets
    const PARTICLE_COUNT = 2200;
    let scene, camera, renderer, particleSystem;
    
    let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    let spacePositions = new Float32Array(PARTICLE_COUNT * 3);
    let heartPositions = new Float32Array(PARTICLE_COUNT * 3);
    let namePositions = new Float32Array(PARTICLE_COUNT * 3);
    let squarePositions = new Float32Array(PARTICLE_COUNT * 3);

    let activeTarget = 'space'; 
    let desiredColor = new THREE.Color(0x00f0ff);

    // Create glowing circle particle texture
    function createParticleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 32;
      canvas.height = 32;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.4, 'rgba(255,255,255,0.8)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(16, 16, 16, 0, Math.PI * 2);
      ctx.fill();
      return new THREE.CanvasTexture(canvas);
    }

    // Build ultra-clear particle layouts
    function buildPositions() {
      
      // 1. GALAXY SPHERE
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = Math.cbrt(Math.random()) * 20;

        spacePositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        spacePositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        spacePositions[i * 3 + 2] = r * Math.cos(phi);
        
        currentPositions[i * 3] = spacePositions[i * 3];
        currentPositions[i * 3 + 1] = spacePositions[i * 3 + 1];
        currentPositions[i * 3 + 2] = spacePositions[i * 3 + 2];
      }

      // 2. CLEAR HEART SHAPE
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const t = (i / PARTICLE_COUNT) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        
        heartPositions[i * 3] = x * 0.85;
        heartPositions[i * 3 + 1] = y * 0.85;
        heartPositions[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
      }

      // 3. ULTRA-READABLE BIG BOLD TEXT ("BHUMI & AYUSH")
      const canvas = document.createElement('canvas');
      canvas.width = 1200;
      canvas.height = 300;
      const ctx = canvas.getContext('2d');
      
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 85px Arial, Helvetica, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("BHUMI & AYUSH", 600, 150);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const points = [];

      for (let y = 0; y < canvas.height; y += 4) {
        for (let x = 0; x < canvas.width; x += 4) {
          const alpha = imgData.data[(y * canvas.width + x) * 4];
          if (alpha > 128) {
            points.push({
              x: (x - 600) * 0.055,
              y: (150 - y) * 0.055
            });
          }
        }
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const pt = points[i % points.length];
        namePositions[i * 3] = pt.x;
        namePositions[i * 3 + 1] = pt.y;
        namePositions[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
      }

      // 4. CLEAR SQUARE
      const size = 20;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const edge = i % 4;
        const progress = (Math.random() - 0.5) * size;

        if (edge === 0) { squarePositions[i*3] = progress; squarePositions[i*3+1] = size/2; }
        else if (edge === 1) { squarePositions[i*3] = size/2; squarePositions[i*3+1] = progress; }
        else if (edge === 2) { squarePositions[i*3] = progress; squarePositions[i*3+1] = -size/2; }
        else { squarePositions[i*3] = -size/2; squarePositions[i*3+1] = progress; }

        squarePositions[i * 3 + 2] = (Math.random() - 0.5) * 1.0;
      }
    }

    function initThreeJS() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 28;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      buildPositions();

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(currentPositions, 3));

      const material = new THREE.PointsMaterial({
        size: 0.5,
        map: createParticleTexture(),
        color: desiredColor,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      particleSystem = new THREE.Points(geometry, material);
      scene.add(particleSystem);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      const positions = particleSystem.geometry.attributes.position.array;
      let targetArray = spacePositions;

      if (activeTarget === 'heart') {
        targetArray = heartPositions;
        desiredColor.setHex(0xff0066); // Hot Pink
      } else if (activeTarget === 'name') {
        targetArray = namePositions;
        desiredColor.setHex(0x00ffff); // Neon Cyan
      } else if (activeTarget === 'square') {
        targetArray = squarePositions;
        desiredColor.setHex(0x00ff66); // Bright Green
      } else {
        desiredColor.setHex(0xffaa00); // Amber Yellow Cloud
      }

      // Smooth position morphing interpolation
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        positions[i] += (targetArray[i] - positions[i]) * 0.1;
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;

      // Color transition
      particleSystem.material.color.lerp(desiredColor, 0.08);

      // Rotate galaxy sphere
      if (activeTarget === 'space') {
        particleSystem.rotation.y += 0.003;
      } else {
        particleSystem.rotation.y += (0 - particleSystem.rotation.y) * 0.1;
      }

      renderer.render(scene, camera);
    }

    function initGestureTracking() {
      const videoElement = document.getElementById('webcam');
      const statusText = document.getElementById('gesture-status');

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults((results) => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const lm = results.multiHandLandmarks[0];

          // Check basic finger positions
          const indexUp = lm[8].y < lm[6].y;
          const middleUp = lm[12].y < lm[10].y;
          const ringUp = lm[16].y < lm[14].y;
          const pinkyUp = lm[20].y < lm[18].y;
          const thumbUp = lm[4].y < lm[3].y && lm[4].y < lm[8].y;

          // Simple Gesture Logic:
          if (indexUp && middleUp && ringUp && pinkyUp) {
            // 🖐️ OPEN HAND -> BHUMI & AYUSH TEXT
            activeTarget = 'name';
            statusText.innerHTML = "Gesture: <b>🖐️ Open Hand ('BHUMI & AYUSH')</b>";
            statusText.style.color = "#00ffff";
          } 
          else if (thumbUp && !indexUp && !middleUp) {
            // 👍 THUMBS UP -> HEART
            activeTarget = 'heart';
            statusText.innerHTML = "Gesture: <b>👍 Thumbs Up (Heart ❤️)</b>";
            statusText.style.color = "#ff0066";
          } 
          else if (indexUp && middleUp && !ringUp && !pinkyUp) {
            // ✌️ PEACE SIGN -> SQUARE
            activeTarget = 'square';
            statusText.innerHTML = "Gesture: <b>✌️ Peace Sign (Square 🟩)</b>";
            statusText.style.color = "#00ff66";
          } 
          else {
            // ✊ FIST / NEUTRAL -> GALAXY CLOUD
            activeTarget = 'space';
            statusText.innerHTML = "Gesture: <b>Hand Detected (Show Gesture)</b>";
            statusText.style.color = "#ffffff";
          }
        } else {
          activeTarget = 'space';
          statusText.innerHTML = "Status: <b>Searching for Hand...</b>";
          statusText.style.color = "#ffaa00";
        }
      });

      const cameraUtil = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 320,
        height: 240
      });

      cameraUtil.start();
    }

    window.onload = () => {
      initThreeJS();
      animate();
      initGestureTracking();
    };
  </script>
</body>
</html>
